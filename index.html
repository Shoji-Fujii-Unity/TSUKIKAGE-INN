<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>丑三つの宿 月影亭怪談 | TSUKIKAGE INN — Ghost Hour Escape</title>
<style>
:root{
  --gold:#e0b64b; --red:#c3403a; --ink:#0a0d18; --panel:rgba(9,12,22,.88);
  --line:#3a4160; --txt:#e6e4d8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#05070f;overflow:hidden;
  font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","MS Mincho",serif;color:var(--txt)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1200px 700px at 50% 30%, #10182c 0%, #05070f 70%)}
#stage{position:relative;background:#000;box-shadow:0 0 60px rgba(0,0,0,.9),0 0 0 1px #262e4a;border-radius:6px;overflow:hidden}
#view{position:absolute;left:0;top:0;width:100%;display:block;background:#0b0f1c}
/* ---------- hotspots ---------- */
.hs{fill:rgba(0,0,0,0);cursor:pointer}
.hs:hover{}
.hs:focus{outline:none}
.pulse{fill:none;stroke:#efe2b4;stroke-width:2;opacity:.0;animation:pulse 2.6s ease-in-out infinite;pointer-events:none;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.55);opacity:0}35%{opacity:.75}70%{opacity:.5}100%{transform:scale(1.25);opacity:0}}
.navp{animation:navp 1.8s ease-in-out infinite;pointer-events:none}
@keyframes navp{0%,100%{opacity:.35}50%{opacity:.95}}
.flame{transform-box:fill-box;transform-origin:50% 90%;animation:fl 1.3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scaleY(1) scaleX(1);opacity:.95}40%{transform:scaleY(1.12) scaleX(.92);opacity:1}70%{transform:scaleY(.94) scaleX(1.05);opacity:.85}}
.fog{transform-box:fill-box;animation:fogm 26s ease-in-out infinite alternate}
.fog.b{animation-duration:34s;animation-direction:alternate-reverse}
@keyframes fogm{from{transform:translateX(-60px)}to{transform:translateX(70px)}}
.sn{transform-box:fill-box;animation:snf linear infinite}
@keyframes snf{from{transform:translateY(-40px)}to{transform:translateY(780px)}}
.sway{transform-box:fill-box;transform-origin:center top;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.bob{transform-box:fill-box;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mist{animation:mist 7s ease-in-out infinite}
@keyframes mist{0%,100%{opacity:.14}50%{opacity:.30}}
.shakew{animation:shk 0.35s linear 3}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}75%{transform:translate(5px,-3px)}}
/* ---------- UI ---------- */
#topbar{position:absolute;right:10px;top:10px;display:flex;gap:8px;z-index:30}
#topbar button{width:46px;height:40px;font-size:19px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);cursor:pointer;backdrop-filter:blur(3px)}
#topbar button:active{background:#232c47}
#topbar #bLang{width:auto;padding:0 10px;font-size:14px;font-family:inherit}
#scname{position:absolute;left:14px;top:12px;z-index:30;font-size:17px;letter-spacing:3px;color:#cfc9b4;
  background:rgba(5,7,14,.55);padding:5px 14px;border:1px solid #2c3352;border-radius:4px;pointer-events:none}
#tip{position:absolute;z-index:40;pointer-events:none;background:rgba(8,10,20,.92);border:1px solid var(--line);
  padding:5px 12px;border-radius:6px;font-size:14px;color:#efe9d6;transform:translate(-50%,-130%);white-space:nowrap}
#msg{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:35;max-width:76%;
  background:rgba(7,9,18,.92);border:1px solid #4a5170;border-left:4px solid var(--gold);
  padding:10px 20px;border-radius:8px;font-size:16.5px;text-align:center;line-height:1.45;
  color:#f0ecdd;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#inv{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(180deg,#0d1120,#070a14);
  border-top:1px solid #2c3352;display:flex;align-items:center;gap:8px;padding:8px 12px;z-index:30;overflow-x:auto}
#inv .slot{min-width:74px;width:74px;height:76px;border:1px solid #333c5e;border-radius:10px;background:#111728;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
#inv .slot svg{width:44px;height:44px}
#inv .slot .nm{font-size:10.5px;color:#b9b4a0;margin-top:1px;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#inv .slot.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(224,182,75,.55);background:#1a2138}
#inv .tag{font-size:11px;color:#8a8570;writing-mode:vertical-rl;letter-spacing:2px;margin-right:2px}
/* ---------- dialogue ---------- */
#dlg{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;width:min(88%,860px);
  background:linear-gradient(180deg,rgba(12,15,28,.97),rgba(8,10,20,.97));border:1px solid #55451f;
  border-top:3px solid var(--red);border-radius:10px;padding:14px 22px 12px;box-shadow:0 14px 40px rgba(0,0,0,.8)}
#dlg .who{font-size:15px;color:var(--red);letter-spacing:2px;margin-bottom:6px}
#dlg .txt{font-size:17.5px;line-height:1.55;min-height:52px;white-space:pre-wrap}
#dlg .more{font-size:12px;color:#8f8a75;text-align:right}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:80;background:rgba(4,6,12,.82);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.card{background:#0d1120;border:1px solid var(--line);border-top:3px solid var(--red);border-radius:12px;
  padding:22px 26px;max-width:86%;max-height:88%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.9);text-align:center}
.card h2{margin:0 0 12px;font-size:22px;letter-spacing:3px;color:#efe6cc}
.card p{font-size:15px;line-height:1.7;color:#c9c4b2;margin:8px 0}
.btn{display:inline-block;margin:8px 6px 0;padding:10px 26px;font-size:16px;font-family:inherit;letter-spacing:2px;
  color:#efe9d6;background:#1a2136;border:1px solid #4a5170;border-radius:8px;cursor:pointer}
.btn:active{background:#2a3453}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.hidden{display:none!important}
#titleOv{background:radial-gradient(900px 600px at 62% 35%,#151d33 0%,#05070f 75%)}
#titleOv .logo{margin:0}
#rotOv{z-index:120;background:#05070f}
#endOv{background:#05070f}
input.pinput{width:78%;padding:10px;font-size:18px;font-family:inherit;background:#141a2c;border:1px solid var(--line);
  border-radius:8px;color:#f0ecdd;text-align:center}
.dialrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.dial{width:76px;height:96px;background:#141a2c;border:1px solid #4a5170;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .num{font-size:44px;color:var(--gold);font-weight:bold}
.dial button{width:60px;height:26px;font-size:15px;background:#1a2136;color:#cfc9b4;border:1px solid #3a4160;border-radius:6px;cursor:pointer}
#mapOv svg{width:min(92%,900px);height:auto}
.small{font-size:12.5px;color:#8a8570}
kbd{background:#1a2136;border:1px solid #3a4160;border-radius:4px;padding:1px 6px;font-size:12px}
</style>
</head>

let AC=null,MASTER=null,WIND=null,creakTimer=null,noiseBuf=null;
function ensureAC(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();
  MASTER=AC.createGain();MASTER.gain.value=soundOn?0.55:0;MASTER.connect(AC.destination);
  const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  startAmb();}catch(e){AC=null;}}
function startAmb(){if(!AC||WIND)return;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=0.7;
  const g=AC.createGain();g.gain.value=0.12;
  const lfo=AC.createOscillator();lfo.frequency.value=0.07;
  const lg=AC.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  src.connect(bp);bp.connect(g);g.connect(MASTER);src.start();WIND=src;
  const o1=AC.createOscillator(),o2=AC.createOscillator(),og=AC.createGain();
  o1.frequency.value=52;o2.frequency.value=53.7;o1.type=o2.type='sine';og.gain.value=0.035;
  o1.connect(og);o2.connect(og);og.connect(MASTER);o1.start();o2.start();
  scheduleCreak();}
function scheduleCreak(){clearTimeout(creakTimer);
  creakTimer=setTimeout(()=>{if(AC&&soundOn)randomCreak();scheduleCreak();},12000+Math.random()*22000);}
function randomCreak(){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='lowpass';f.frequency.value=900;o.type='sawtooth';
  o.frequency.setValueAtTime(160+Math.random()*120,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(40,AC.currentTime+1.1);
  g.gain.setValueAtTime(0.001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.05,AC.currentTime+0.08);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+1.3);
  o.connect(f);f.connect(g);g.connect(MASTER);o.start();o.stop(AC.currentTime+1.4);}
function tone(freq,dur,type,vol,when,slideTo){if(!AC)return;const t0=AC.currentTime+(when||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(MASTER);o.start(t0);o.stop(t0+dur+0.05);}
function noiseHit(dur,vol,freq){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||800;f.Q.value=1.2;
  const g=AC.createGain();const t0=AC.currentTime;
  g.gain.setValueAtTime(vol||0.2,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(MASTER);s.start(t0);s.stop(t0+dur+0.05);}

  else msg(t('m_mirror3'));break;

  else msg(t('m_vanity0'));break;
 case 'bath.salt': if(!F('salt')){setF('salt');take('salt');msg(t('m_salt'));}else msg(t('m_salt0'));break;

 case 'att.box': msg(t('m_abox'));break;

  if(has('plate')){remInv('plate');setF('turned');sfx('wail');
   say('d_okiwa',['d_ow1t','d_ow2t','d_ow3t'],()=>{setF('wellDone');take('gatekey');setF('gotKey');msg(t('m_gotkey'));});}
  else if(!F('wellMet')){setF('wellMet');sfx('tick');say('d_okikucount',['d_oc1','d_oc2','d_oc3','d_oc4'],()=>msg(t('m_ghostback')));}

 case 'well.bucket': msg(t('m_bucket'));break;

 case 'well.out': goto('gar');break;
 /* storehouse */
 case 'sou.shelf': msg(t('m_shelf0'));break;
 case 'sou.paper': if(!F('note1')){setF('note1');say('',['m_note']);}break;

 say('',['d_end1t','d_end2t','d_end3t'],()=>{sfx('rooster');showEnd();});}
function showEnd(){const n=tanzs();
 $('endBox').innerHTML=`<div class="card" style="text-align:center;max-width:92%">
  <svg viewBox="0 0 400 150" style="width:min(80%,430px)">
   <defs><linearGradient id="dawnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c38"/><stop offset="1" stop-color="#c88a5a"/></linearGradient></defs>
   <rect width="400" height="150" fill="url(#dawnG)"/>
   <circle cx="200" cy="148" r="44" fill="#f4e6c8" opacity=".92"/>
   <path d="M0 112 L55 92 L115 112 L175 88 L245 112 L310 92 L400 114 L400 150 L0 150 Z" fill="#0a0e19"/>
   <path d="M172 90 L200 74 L228 90 L222 90 L200 80 L178 90 Z" fill="#141a2a"/>
   <rect x="193" y="92" width="15" height="20" fill="#141a2a"/>
  </svg>
  <h2 style="letter-spacing:6px;margin:10px 0 4px">${t('endTitle')}</h2>
  <p style="margin:6px 0">${t('endLine1')}</p>
  <p style="font-size:14px;color:#bdb7a2;margin:6px 0">${t('endLine2')}</p>
  <p style="color:var(--gold);margin:10px 0 2px">${tf('endTanz',{N:n})}${n>=TANZ?'\u2605':''}</p>
  <p class="small" style="margin:4px 0 14px">${tf('endHintN',{N:S.hints})}</p>
  <button class="btn gold" id="eAgain">${t('endAgain')}</button>
  <button class="btn" id="eBack">${t('endBack')}</button></div>`;
 $('endOv').classList.remove('hidden');
 $('eAgain').onclick=()=>{$('endOv').classList.add('hidden');startRun();};
 $('eBack').onclick=()=>{$('endOv').classList.add('hidden');showTitle();};
 save();}
/* ============ title / chrome ============ */
function showTitle(){$('tCont').classList.toggle('hidden',!hasSave());
 $('tClr').innerHTML=hasSave()?`<button class="btn" id="tErase" style="font-size:13px">${t('ui_erase')}</button>`:'';
 const e=$('tErase');if(e)e.onclick=()=>{try{localStorage.removeItem(SAVEKEY);}catch(err){}showTitle();};
 $('titleOv').classList.remove('hidden');}
function hideOv(id){$(id).classList.add('hidden');}
function startRun(){hideOv('titleOv');newGame();save();draw();say('',['m_start1','m_start2']);}
function setLangUI(){$('bLang').textContent=lang==='ja'?'EN':'\u65e5\u672c\u8a9e';
 $('tLang').textContent=lang==='ja'?'EN':'\u65e5\u672c\u8a9e';
 $('howP').innerText=t('howP');
 $('rotMsg').innerText=t('rotMsg');$('rotOk').textContent=t('rotOk');
 setSoundUI();}
function toggleLang(){lang=lang==='ja'?'en':'ja';setLangUI();draw();save();}
function rotCheck(){let dismissed=window.__rotOK||false;
 $('rotOv').classList.toggle('hidden',!(window.innerWidth<window.innerHeight&&!dismissed));}
function fitStage(){const w=window.innerWidth,h=window.innerHeight,a=1280/720;
 let W=Math.min(w,Math.round(h*a)),H=Math.round(W/a);if(H>h){H=h;W=Math.round(H*a);}
 const st=$('stage');st.style.width=W+'px';st.style.height=H+'px';$('view').style.height=H+'px';}
/* ============ init ============ */
let started=false;
document.addEventListener('pointerdown',()=>{if(started)return;started=true;ensureAC();if(soundOn){startAmb();scheduleCreak();}},{once:true});
$('dlg').addEventListener('click',dlgTap);
$('bHint').onclick=doHint;
$('bMap').onclick=openMap;
$('mapClose').onclick=()=>hideOv('mapOv');
$('bSave').onclick=()=>{save();sfx('pick');msg(t('ui_saved'));};
$('bSnd').onclick=toggleSound;
$('bLang').onclick=toggleLang;
$('tStart').onclick=()=>{ensureAC();if(soundOn){startAmb();scheduleCreak();}startRun();};
$('tCont').onclick=()=>{ensureAC();if(soundOn){startAmb();scheduleCreak();}
 if(load()){setLangUI();hideOv('titleOv');draw();msg(t('ui_cont1'));}else showTitle();};
$('tHow').onclick=()=>{setLangUI();$('howOv').classList.remove('hidden');};
$('howClose').onclick=()=>hideOv('howOv');
$('tFull').onclick=()=>{try{document.documentElement.requestFullscreen();}catch(e){}};
$('tSnd').onclick=toggleSound;
$('tLang').onclick=toggleLang;
$('dialOk').onclick=()=>{if(S.dial[0]===3&&S.dial[1]===5&&S.dial[2]===8){setF('storeOpen');sfx('unlock');msg(t('m_doorlock'));}
 else{sfx('err');msg(t('m_doorwrong'));}hideOv('dialOv');draw();autosave();};
$('dialX').onclick=()=>hideOv('dialOv');
$('prOk').onclick=()=>{const v=$('prIn').value;$('promptOv').classList.add('hidden');if(prCb)prCb(v);};
$('prX').onclick=()=>{$('promptOv').classList.add('hidden');};
$('prIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('prOk').click();});
$('rotOk').onclick=()=>{window.__rotOK=true;rotCheck();};
window.addEventListener('resize',()=>{fitStage();rotCheck();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){['howOv','mapOv','dialOv','promptOv'].forEach(id=>hideOv(id));}
 if(e.key===' '&&Q){e.preventDefault();dlgTap();}});
try{const raw=localStorage.getItem(SAVEKEY);if(raw){const d=JSON.parse(raw);lang=d.lang||'ja';soundOn=d.soundOn!==false;}}catch(e){}
fitStage();setLangUI();setSoundUI();draw();showTitle();rotCheck();
</script>
</body>
</html>
